<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>FLIP 7 – Classement</title>

<style>
:root {
  --bleu-clair: #6EC6E9;
  --bleu-fonce: #1E88B5;
  --jaune: #FFD84D;
  --blanc: #ffffff;
  --gris-clair: #f4f7fb;
}

body {
  margin: 0;
  font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
  background: linear-gradient(135deg, var(--bleu-clair), #B3E5FC);
  color: #033;
}

h1 {
  text-align: center;
  margin: 20px 0;
  font-size: 3em;
  color: var(--blanc);
  text-shadow: 2px 2px var(--bleu-fonce);
}

.container {
  max-width: 900px;
  margin: auto;
  background: var(--gris-clair);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

input, select {
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin: 5px;
  font-size: 1em;
}

button {
  padding: 12px 18px;
  border-radius: 12px;
  border: none;
  background: var(--bleu-fonce);
  color: white;
  font-size: 1em;
  cursor: pointer;
  margin: 5px;
  box-shadow: 0 4px 0 #0d5f85;
}

button:hover { transform: translateY(-2px); }
button:active { transform: translateY(2px); box-shadow: none; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

th {
  background: var(--bleu-fonce);
  color: white;
  padding: 12px;
}

td {
  background: white;
  padding: 10px;
  text-align: center;
  font-size: 1.1em;
}

tr:nth-child(1) td {
  background: var(--jaune);
  font-weight: bold;
}

/* ===== MODE TV ===== */
body.tv #controls { display: none; }
body.tv h1 { font-size: 4em; }
body.tv table { font-size: 1.6em; }

/* ===== FLIP 7 OVERLAY ===== */
.flip7-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: radial-gradient(circle, var(--jaune), var(--bleu-clair));
  z-index: 999;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  font-size: 4em;
  color: #033;
}
.flip7-overlay span { font-size: 1.5em; }
</style>
</head>

<body>

<h1>FLIP 7</h1>

<div class="container" id="controls">

  <h2>Ajouter un joueur</h2>
  <input id="playerName" placeholder="Nom du joueur">
  <button onclick="addPlayer()">Ajouter</button>

  <h2>Ajouter des points</h2>
  <select id="playerSelect"></select>
  <input type="number" id="points" placeholder="Points">
  <button onclick="addPoints()">Valider</button>

  <h2>Classement</h2>
  <table>
    <thead>
      <tr>
        <th>Rang</th>
        <th>Joueur</th>
        <th>Points</th>
      </tr>
    </thead>
    <tbody id="ranking"></tbody>
  </table>

  <h2>Actions</h2>
  <button onclick="showFlip7()">FLIP 7</button>
  <button onclick="undo()">Retour arrière</button>
  <button onclick="resetGame()">Réinitialiser</button>
</div>

<div class="flip7-overlay" id="flip7">
  FLIP 7
  <span id="flip7Player"></span>
</div>

<script>
let players = JSON.parse(localStorage.getItem("players")) || [];
let history = [];

function save() {
  localStorage.setItem("players", JSON.stringify(players));
}

function updateUI() {
  players.sort((a,b)=>b.points-a.points);
  const tbody = document.getElementById("ranking");
  const select = document.getElementById("playerSelect");
  tbody.innerHTML = "";
  select.innerHTML = "";

  players.forEach((p,i)=>{
    tbody.innerHTML += `<tr><td>${i+1}</td><td>${p.name}</td><td>${p.points}</td></tr>`;
    select.innerHTML += `<option value="${p.name}">${p.name}</option>`;
  });

  save();
}

function addPlayer() {
  const name = playerName.value.trim();
  if(!name) return;
  history.push(JSON.stringify(players));
  players.push({name, points:0});
  playerName.value="";
  updateUI();
}

function addPoints() {
  const name = playerSelect.value;
  const pts = parseInt(points.value);
  if(isNaN(pts)) return;
  history.push(JSON.stringify(players));
  players.find(p=>p.name===name).points += pts;
  points.value="";
  updateUI();
}

function undo() {
  if(history.length===0) return;
  players = JSON.parse(history.pop());
  updateUI();
}

function resetGame() {
  if(!confirm("Réinitialiser le jeu ?")) return;
  players = [];
  history = [];
  save();
  updateUI();
}

/* ===== FLIP 7 (+93 points) ===== */
function showFlip7() {
  const name = playerSelect.value;
  if (!name) return;

  history.push(JSON.stringify(players));
  const player = players.find(p => p.name === name);
  player.points += 93;

  document.getElementById("flip7Player").innerText = name;
  const overlay = document.getElementById("flip7");
  overlay.style.display = "flex";

  updateUI();

  setTimeout(() => overlay.style.display = "none", 3000);
}

/* ===== MODE TV ===== */
if (window.location.search.includes("tv")) {
  document.body.classList.add("tv");
}

/* ===== SYNCHRO AUTOMATIQUE ORDI ⇄ TV ===== */
window.addEventListener("storage", () => {
  players = JSON.parse(localStorage.getItem("players")) || [];
  updateUI();
});

updateUI();
</script>

</body>
</html>
