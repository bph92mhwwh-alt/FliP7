<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>FLIP 7 – Classement</title>

<style>
:root {
  --bleu-clair: #6EC6E9;
  --bleu-fonce: #1E88B5;
  --jaune: #FFD84D;
  --blanc: #ffffff;
  --gris-clair: #f4f7fb;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, var(--bleu-clair), #B3E5FC);
  color: #033;
}

h1 {
  text-align: center;
  margin: 20px 0;
  font-size: 3em;
  color: white;
}

.container {
  max-width: 900px;
  margin: auto;
  background: var(--gris-clair);
  border-radius: 20px;
  padding: 20px;
}

button, input, select {
  padding: 10px;
  margin: 5px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

th {
  background: var(--bleu-fonce);
  color: white;
  padding: 10px;
}

td {
  background: white;
  padding: 10px;
  text-align: center;
}

tr:nth-child(1) td {
  background: var(--jaune);
  font-weight: bold;
}

/* MODE TV */
body.tv #controls { display: none; }
body.tv h1 { font-size: 4em; }
body.tv table { font-size: 1.6em; }

/* FLIP 7 */
.flip7-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: radial-gradient(circle, var(--jaune), var(--bleu-clair));
  z-index: 999;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  font-size: 4em;
}
</style>
</head>

<body>

<h1>FLIP 7</h1>

<div class="container" id="controls">
  <input id="playerName" placeholder="Nom du joueur">
  <button onclick="addPlayer()">Ajouter joueur</button>

  <select id="playerSelect"></select>
  <input type="number" id="points" placeholder="Points">
  <button onclick="addPoints()">Ajouter points</button>

  <button onclick="showFlip7()">FLIP 7</button>
</div>

<table>
  <thead>
    <tr>
      <th>Rang</th>
      <th>Joueur</th>
      <th>Points</th>
    </tr>
  </thead>
  <tbody id="ranking"></tbody>
</table>

<div class="flip7-overlay" id="flip7">
  FLIP 7
  <div id="flip7Player"></div>
</div>

<script>
const isTV = window.location.search.includes("tv");
let players = JSON.parse(localStorage.getItem("players")) || [];

/* ===== RENDER ===== */
function render() {
  const tbody = document.getElementById("ranking");
  const select = document.getElementById("playerSelect");
  tbody.innerHTML = "";
  if (select) select.innerHTML = "";

  players.sort((a,b)=>b.points-a.points);

  players.forEach((p,i)=>{
    tbody.innerHTML += `<tr><td>${i+1}</td><td>${p.name}</td><td>${p.points}</td></tr>`;
    if (select) select.innerHTML += `<option>${p.name}</option>`;
  });
}

/* ===== SAVE (UNIQUEMENT ANIMATEUR) ===== */
function save() {
  if (!isTV) {
    localStorage.setItem("players", JSON.stringify(players));
  }
}

/* ===== ACTIONS ===== */
function addPlayer() {
  players.push({name: playerName.value, points:0});
  save(); render();
}

function addPoints() {
  const p = players.find(x=>x.name===playerSelect.value);
  p.points += parseInt(points.value);
  save(); render();
}

function showFlip7() {
  const p = players.find(x=>x.name===playerSelect.value);
  p.points += 93;
  save(); render();

  flip7Player.innerText = p.name;
  flip7.style.display = "flex";
  setTimeout(()=>flip7.style.display="none",3000);
}

/* ===== SYNC TV ===== */
window.addEventListener("storage", () => {
  players = JSON.parse(localStorage.getItem("players")) || [];
  render();
});

/* ===== INIT ===== */
if (isTV) document.body.classList.add("tv");
render();
</script>

</body>
</html>
