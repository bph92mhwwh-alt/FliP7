<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Jeux TV – Classement</title>

<style>
:root{
  --bleu-nuit:#0f2747;
  --bleu-table:#163a6b;
  --bleu-bouton:#1f5fbf;
  --gris-ligne:#eef2f7;
  --or:#ffd84d;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(160deg,#081a33,#102b52);
  color:white;
}

h1{
  text-align:center;
  margin:20px 0;
  font-size:3em;
  letter-spacing:2px;
}

.container{
  max-width:900px;
  margin:auto;
  background:white;
  color:#111;
  border-radius:18px;
  padding:20px;
}

button,input,select{
  padding:10px;
  margin:5px;
  font-size:1em;
}

button{
  background:var(--bleu-bouton);
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
button:hover{opacity:0.9;}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  background:white;
  color:black;
}

th{
  background:var(--bleu-table);
  color:white;
  padding:12px;
}

td{
  padding:10px;
  text-align:center;
}

/* Lignes alternées */
tbody tr:nth-child(even){
  background:var(--gris-ligne);
}

/* 1er du classement */
tbody tr:first-child td{
  background:var(--or);
  font-weight:bold;
}

/* MODE TV */
body.tv #controls{display:none;}
body.tv h1{font-size:4em;}
body.tv table{font-size:1.7em;}
</style>
</head>

<body>

<h1>JEUX TV</h1>

<div class="container" id="controls">
  <input id="playerName" placeholder="Nom du joueur">
  <button onclick="addPlayer()">Ajouter joueur</button>

  <br>

  <select id="playerSelect"></select>
  <input type="number" id="points" placeholder="Points">
  <button onclick="addPoints()">Ajouter points</button>

  <br><br>

  <button onclick="undo()">Annuler dernière action</button>
  <button onclick="resetGame()">Réinitialiser</button>
</div>

<table>
  <thead>
    <tr>
      <th>Rang</th>
      <th>Joueur</th>
      <th>Points</th>
    </tr>
  </thead>
  <tbody id="ranking"></tbody>
</table>

<script>
const isTV = window.location.search.includes("tv");

let players = JSON.parse(localStorage.getItem("players")) || [];
let history = JSON.parse(localStorage.getItem("history")) || [];

/* ===== sauvegarde ===== */
function save(){
  if(!isTV){
    localStorage.setItem("players",JSON.stringify(players));
    localStorage.setItem("history",JSON.stringify(history));
  }
}

/* ===== affichage ===== */
function render(){
  const tbody=document.getElementById("ranking");
  const select=document.getElementById("playerSelect");
  tbody.innerHTML="";
  if(select) select.innerHTML="";

  players.sort((a,b)=>b.points-a.points);

  players.forEach((p,i)=>{
    tbody.innerHTML+=`<tr><td>${i+1}</td><td>${p.name}</td><td>${p.points}</td></tr>`;
    if(select) select.innerHTML+=`<option>${p.name}</option>`;
  });
}

/* ===== historique ===== */
function snapshot(){
  history.push(JSON.stringify(players));
  if(history.length>50) history.shift();
}

/* ===== actions ===== */
function addPlayer(){
  if(!playerName.value.trim()) return;
  snapshot();
  players.push({name:playerName.value.trim(),points:0});
  playerName.value="";
  save(); render();
}

function addPoints(){
  const p=players.find(x=>x.name===playerSelect.value);
  if(!p || isNaN(points.value)) return;
  snapshot();
  p.points+=parseInt(points.value);
  points.value="";
  save(); render();
}

function undo(){
  if(history.length===0) return;
  players=JSON.parse(history.pop());
  save(); render();
}

function resetGame(){
  if(!confirm("⚠️ Réinitialiser tout le classement ?")) return;
  snapshot();
  players=[];
  save(); render();
}

/* ===== synchro TV ===== */
window.addEventListener("storage",()=>{
  players=JSON.parse(localStorage.getItem("players"))||[];
  history=JSON.parse(localStorage.getItem("history"))||[];
  render();
});

/* ===== init ===== */
if(isTV) document.body.classList.add("tv");
render();
</script>

</body>
</html>
